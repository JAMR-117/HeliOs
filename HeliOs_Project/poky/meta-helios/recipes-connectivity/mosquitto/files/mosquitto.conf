# ==========================================
# HeliOs Industrial MQTT Broker Config
# ==========================================
# Escuchar en todas las interfaces (0.0.0.0) para permitir
# acceso desde el simulador externo (192.168.1.x)
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /data/
log_dest file /data/mosquitto.log
log_type error
log_type warning
log_type information
